<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cold-exit · rig builder</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0c0c10; color: #cbd2dc;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #crumb {
    position: absolute; top: 10px; left: 14px;
    font-size: 12px; color: #60697a;
    background: rgba(14,16,22,0.7);
    padding: 6px 10px; border-radius: 4px;
    pointer-events: none; user-select: none;
  }
  #crumb b { color: #c9a87a; }
  #toast {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1f2a18; border: 1px solid #3e5a2e;
    color: #a8d68a; padding: 8px 14px;
    border-radius: 4px; font-size: 12px;
    opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/",
    "lil-gui": "https://unpkg.com/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="crumb">
  <b>rig builder</b> · drag to orbit · wheel to zoom ·
  <span style="color:#a8d68a">add primitives, parent them, position + scale them</span>
</div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import GUI from 'lil-gui';

// ============================================================
// SCENE
// ============================================================
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0c10);

const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.PerspectiveCamera(35, aspect, 0.1, 100);
camera.position.set(2.6, 2.0, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.update();

// Lighting — same as rig_tuner so what you see here matches in-game.
scene.add(new THREE.HemisphereLight(0x3a4258, 0x06070a, 0.30));
const key = new THREE.DirectionalLight(0xffcf96, 1.10);
key.position.set(3.0, 4.0, 2.0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
const s = 4;
key.shadow.camera.left = -s; key.shadow.camera.right = s;
key.shadow.camera.top = s;   key.shadow.camera.bottom = -s;
key.shadow.bias = -0.0005;
scene.add(key);
scene.add(new THREE.DirectionalLight(0x2a3c5e, 0.40));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x12141a, roughness: 0.95 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
scene.add(new THREE.GridHelper(40, 40, 0x1a1c24, 0x0e1014));

// 1m reference pillar (cream-capped) so authoring scale stays anchored.
(() => {
  const pillar = new THREE.Mesh(
    new THREE.CylinderGeometry(0.02, 0.02, 1.85, 8),
    new THREE.MeshStandardMaterial({ color: 0x3a4050, roughness: 0.85 }),
  );
  pillar.position.set(1.4, 1.85 / 2, 0);
  scene.add(pillar);
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.06, 0.06, 0.005, 16),
    new THREE.MeshStandardMaterial({ color: 0xc9a87a }),
  );
  cap.position.set(1.4, 1.85, 0);
  scene.add(cap);
})();

// ============================================================
// DATA MODEL
// ============================================================
//
// A rig is a flat array of primitives. Each primitive has:
//   id        — unique string
//   name      — user-editable label
//   type      — 'cylinder' | 'sphere' | 'box' | 'cone'
//   parentId  — null (root, parented to scene) or another primitive's id
//   pos.{x,y,z}   — local position relative to parent
//   rot.{x,y,z}   — local euler rotation (radians)
//   scale.{x,y,z} — local scale
//   color     — hex string '#rrggbb'
//   shape     — type-specific dim block:
//     cylinder: { topR, botR, h, segs }
//     sphere:   { r, segsW, segsH }
//     box:      { w, h, d }
//     cone:     { r, h, segs }
//
// The full rig is just an array — no DEFAULT_DIMS, no archetypes, no
// taper machinery. Save / load via JSON.
// ============================================================

const STORAGE_KEY = 'cold-exit-rig-builder-v1';

let primitives = [];
let primIndex = new Map();   // id → primitive
let meshIndex = new Map();   // id → THREE.Mesh
let groupIndex = new Map();  // id → THREE.Group (parent target for children)
let boneIndex = new Map();   // id → THREE.Object3D (axes helper at group origin)
let selectedId = null;
let nextId = 1;

// Display state for the bone visualizer overlay. When true every
// primitive's group origin gets an AxesHelper drawn on top of the
// mesh — useful for seeing where the joint / pivot point of each
// part sits while the mesh is set transparent.
const display = {
  showBones: false,
  boneSize: 0.08,
  // Gizmo mode for the TransformControls handle on the selected
  // primitive. 'off' detaches; 'translate' / 'scale' attach the
  // appropriate handle. (Rotate left out for now — pos + scale are
  // the primary authoring moves; rotation rarely needs gizmo work.)
  gizmoMode: 'translate',
};

const rootGroup = new THREE.Group();
scene.add(rootGroup);

function newId(stem = 'part') {
  return `${stem}_${(nextId++).toString(36)}`;
}

// ============================================================
// UNDO STACK
// ============================================================
// Snapshot the entire primitives array on every mutation that the
// user can reasonably want to revert. Ctrl+Z pops the most recent
// snapshot and restores. Cap the stack at 50 entries so an
// indefinite editing session doesn't accumulate forever.
const undoStack = [];
const UNDO_MAX = 50;

function pushUndo() {
  undoStack.push(JSON.stringify(primitives));
  if (undoStack.length > UNDO_MAX) undoStack.shift();
}

function undo() {
  if (undoStack.length === 0) {
    showToast('Nothing to undo.');
    return;
  }
  const snap = undoStack.pop();
  primitives = JSON.parse(snap);
  // Rebuild the selection if the previously-selected primitive
  // still exists; otherwise clear selection.
  if (selectedId && !primitives.find(p => p.id === selectedId)) {
    selectedId = null;
  }
  rebuild();
  rebuildPartsFolder();
  rebuildEditor();
  showToast(`Undo (${undoStack.length} left).`);
}

window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    // Skip when typing in a text input (lil-gui slider field, prompt).
    const tag = document.activeElement?.tagName?.toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    e.preventDefault();
    undo();
  }
});

function defaultPrim(type) {
  const id = newId(type);
  const base = {
    id,
    name: id,
    type,
    parentId: null,
    pos: { x: 0, y: 1.0, z: 0 },
    rot: { x: 0, y: 0, z: 0 },
    scale: { x: 1, y: 1, z: 1 },
    // When true (default), scale propagates to descendants via the
    // group transform — scaling the pelvis bigger also scales the
    // legs / arms attached to it. When false, scale is applied to
    // the MESH only, so this primitive grows / shrinks while its
    // children stay at their authored size.
    scaleChildren: true,
    color: '#3a4048',
    opacity: 1.0,
  };
  if (type === 'cylinder') base.shape = {
    topR: 0.10, botR: 0.10, h: 0.30, segs: 24,
    // Per-end Z depth taper. When topDepth != botDepth the cylinder's
    // vertices get per-Y Z-scaled so top and bottom have different
    // front-back depths (egg / pyramid-section profile). Default 1/1
    // = uniform circular cylinder.
    topDepth: 1.0, botDepth: 1.0,
  };
  if (type === 'sphere')   base.shape = { r: 0.12, segsW: 24, segsH: 16 };
  if (type === 'box')      base.shape = { w: 0.20, h: 0.20, d: 0.20 };
  if (type === 'cone')     base.shape = { r: 0.12, h: 0.20, segs: 24 };
  return base;
}

// Per-end Z taper for cylinders. When topDepth != botDepth, deform
// each vertex's Z by a per-Y interpolated factor between bot and top.
// Top of cylinder ends up scaled by topDepth, bottom by botDepth,
// linear in between. End caps stay flat (their vertices share Y).
function applyCylinderDepthTaper(geo, topDepth, botDepth, h) {
  if (Math.abs(topDepth - botDepth) < 1e-4 && Math.abs(topDepth - 1.0) < 1e-4) return;
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    const t = Math.max(0, Math.min(1, (y + h / 2) / h));
    const d = botDepth + (topDepth - botDepth) * t;
    pos.setZ(i, pos.getZ(i) * d);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
}

function buildMeshFor(prim) {
  let geo;
  if (prim.type === 'cylinder') {
    geo = new THREE.CylinderGeometry(prim.shape.topR, prim.shape.botR, prim.shape.h, prim.shape.segs);
    applyCylinderDepthTaper(geo, prim.shape.topDepth ?? 1.0, prim.shape.botDepth ?? 1.0, prim.shape.h);
  } else if (prim.type === 'sphere') {
    geo = new THREE.SphereGeometry(prim.shape.r, prim.shape.segsW, prim.shape.segsH);
  } else if (prim.type === 'box') {
    geo = new THREE.BoxGeometry(prim.shape.w, prim.shape.h, prim.shape.d);
  } else if (prim.type === 'cone') {
    geo = new THREE.ConeGeometry(prim.shape.r, prim.shape.h, prim.shape.segs);
  } else {
    throw new Error('unknown primitive type: ' + prim.type);
  }
  const opacity = (prim.opacity == null) ? 1.0 : prim.opacity;
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(prim.color),
    roughness: 0.85,
    metalness: 0.05,
    transparent: opacity < 1.0,
    opacity,
    depthWrite: opacity >= 0.999,    // fully opaque writes depth normally
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Rebuild the entire scene tree from the primitives array. Called
// after any data mutation. Cheap because we're talking dozens of
// primitives, not thousands.
function rebuild() {
  // Clear previous
  for (const m of meshIndex.values()) {
    m.geometry?.dispose?.();
    m.material?.dispose?.();
    m.parent?.remove(m);
  }
  for (const b of boneIndex.values()) {
    b.parent?.remove(b);
    if (b.geometry) b.geometry.dispose?.();
    if (b.material) b.material.dispose?.();
  }
  for (const g of groupIndex.values()) g.parent?.remove(g);
  meshIndex = new Map();
  groupIndex = new Map();
  boneIndex = new Map();
  primIndex = new Map();
  for (const p of primitives) primIndex.set(p.id, p);

  // Build groups (parent containers) for every primitive — each
  // primitive's children attach to its group, not its mesh.
  for (const p of primitives) {
    const g = new THREE.Group();
    g.name = p.name;
    groupIndex.set(p.id, g);
  }

  // Parent groups according to parentId.
  // scaleChildren TRUE (default): group.scale = primitive.scale, mesh.scale = 1
  //   → both this primitive AND its descendants scale together.
  // scaleChildren FALSE: group.scale = 1, mesh.scale = primitive.scale
  //   → only this primitive's mesh scales; descendants attached to
  //   the group stay at their authored size.
  for (const p of primitives) {
    const g = groupIndex.get(p.id);
    const parent = p.parentId ? groupIndex.get(p.parentId) : rootGroup;
    parent.add(g);
    g.position.set(p.pos.x, p.pos.y, p.pos.z);
    g.rotation.set(p.rot.x, p.rot.y, p.rot.z);
    if (p.scaleChildren !== false) {
      g.scale.set(p.scale.x, p.scale.y, p.scale.z);
    } else {
      g.scale.set(1, 1, 1);
    }
  }

  // Build mesh inside each group
  for (const p of primitives) {
    const g = groupIndex.get(p.id);
    const m = buildMeshFor(p);
    if (p.scaleChildren === false) {
      m.scale.set(p.scale.x, p.scale.y, p.scale.z);
    }
    g.add(m);
    meshIndex.set(p.id, m);
  }

  // Bone helpers — at each group's origin, draw an AxesHelper so the
  // pivot point of each primitive is visible. Drawn on top of the
  // mesh (renderOrder + depthTest off) so transparent meshes don't
  // hide the bone marker.
  if (display.showBones) {
    for (const p of primitives) {
      const g = groupIndex.get(p.id);
      const axes = new THREE.AxesHelper(display.boneSize);
      // Render-on-top so the bones always show, even through opaque
      // primitive surfaces. Useful while authoring.
      axes.material.depthTest = false;
      axes.material.depthWrite = false;
      axes.renderOrder = 999;
      g.add(axes);
      boneIndex.set(p.id, axes);
    }
  }

  // Selection ring + gizmo
  refreshSelectionVisual();
  attachGizmoToSelected();
}

// ============================================================
// TRANSFORM GIZMO
// ============================================================
// One TransformControls instance, switchable between translate /
// scale modes. Attached to the selected primitive's group on
// selection change. Disables orbit controls during drag so the
// camera doesn't fight the gizmo.
const tControls = new TransformControls(camera, renderer.domElement);
tControls.setMode(display.gizmoMode === 'off' ? 'translate' : display.gizmoMode);
tControls.setSize(0.7);
tControls.addEventListener('dragging-changed', (e) => {
  controls.enabled = !e.value;
  // Drag started — push undo snapshot before any value change.
  if (e.value) pushUndo();
  // Drag ended — flush the live transform back into the primitive
  // data so save/export captures the move. Scale source depends on
  // scaleChildren: if false the gizmo was attached to the MESH
  // (so descendants stay put); if true it was attached to the GROUP
  // (descendants scale with parent).
  if (!e.value && selectedId) {
    const p = primIndex.get(selectedId);
    const g = groupIndex.get(selectedId);
    const m = meshIndex.get(selectedId);
    if (p && g) {
      // Position always lives on the group regardless of mode.
      p.pos.x = g.position.x;
      p.pos.y = g.position.y;
      p.pos.z = g.position.z;
      // Scale: pull from whichever object the gizmo was attached to.
      if (display.gizmoMode === 'scale' && p.scaleChildren === false && m) {
        p.scale.x = m.scale.x;
        p.scale.y = m.scale.y;
        p.scale.z = m.scale.z;
      } else {
        p.scale.x = g.scale.x;
        p.scale.y = g.scale.y;
        p.scale.z = g.scale.z;
      }
      rebuildEditor();
    }
  }
});
scene.add(tControls);

function attachGizmoToSelected() {
  if (display.gizmoMode === 'off' || !selectedId) {
    tControls.detach();
    return;
  }
  const p = primIndex.get(selectedId);
  const g = groupIndex.get(selectedId);
  const m = meshIndex.get(selectedId);
  // For scale + scaleChildren=false, attach to the mesh so the
  // gizmo's drag scales just the mesh (descendants outside the mesh
  // are unaffected). Translate always uses the group.
  if (display.gizmoMode === 'scale' && p && p.scaleChildren === false && m) {
    tControls.attach(m);
  } else if (g) {
    tControls.attach(g);
  } else {
    tControls.detach();
  }
}

let selRing = null;
function refreshSelectionVisual() {
  if (selRing) { selRing.parent?.remove(selRing); selRing.geometry.dispose(); selRing = null; }
  if (!selectedId) return;
  const m = meshIndex.get(selectedId);
  if (!m) return;
  // Wire-frame box of the mesh's bounding box
  m.geometry.computeBoundingBox();
  const b = m.geometry.boundingBox;
  const w = b.max.x - b.min.x;
  const h = b.max.y - b.min.y;
  const d = b.max.z - b.min.z;
  const ringGeo = new THREE.BoxGeometry(w * 1.04, h * 1.04, d * 1.04);
  const edges = new THREE.EdgesGeometry(ringGeo);
  selRing = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xf2c060 }));
  selRing.position.set((b.max.x + b.min.x) / 2, (b.max.y + b.min.y) / 2, (b.max.z + b.min.z) / 2);
  m.add(selRing);
  ringGeo.dispose();   // edges already extracted
}

// ============================================================
// GUI
// ============================================================
const gui = new GUI({ title: 'rig builder', width: 360 });

const displayFolder = gui.addFolder('display');
displayFolder.add(display, 'showBones').name('show bones (axes)').onChange(rebuild);
displayFolder.add(display, 'boneSize', 0.01, 0.5, 0.01).name('bone size').onChange(rebuild);
displayFolder.add(display, 'gizmoMode', ['translate', 'scale', 'off']).name('gizmo mode')
  .onChange((m) => {
    if (m !== 'off') tControls.setMode(m);
    attachGizmoToSelected();
  });
displayFolder.add({ undo: () => undo() }, 'undo').name('undo (Ctrl+Z)');
displayFolder.add({
  allTransparent: () => {
    for (const p of primitives) p.opacity = 0.35;
    rebuild();
    rebuildEditor();
    showToast('All primitives → 35% opacity.');
  },
}, 'allTransparent').name('all → 35% opacity');
displayFolder.add({
  allOpaque: () => {
    for (const p of primitives) p.opacity = 1.0;
    rebuild();
    rebuildEditor();
    showToast('All primitives → opaque.');
  },
}, 'allOpaque').name('all → opaque');

const addFolder = gui.addFolder('add primitive');
const addOps = {
  cylinder: () => addPrim('cylinder'),
  sphere:   () => addPrim('sphere'),
  box:      () => addPrim('box'),
  cone:     () => addPrim('cone'),
};
addFolder.add(addOps, 'cylinder').name('+ cylinder');
addFolder.add(addOps, 'sphere').name('+ sphere');
addFolder.add(addOps, 'box').name('+ box');
addFolder.add(addOps, 'cone').name('+ cone');

const partsFolder = gui.addFolder('parts');
let partsList = null;

function rebuildPartsFolder() {
  if (partsList) partsList.destroy();
  partsList = partsFolder.addFolder('list');
  partsList.open();
  for (const p of primitives) {
    const labelObj = {
      select: () => selectPrim(p.id),
    };
    partsList.add(labelObj, 'select').name(`${p.name} (${p.type})`);
  }
}
rebuildPartsFolder();

const editorFolder = gui.addFolder('selected');
let editorControls = [];

function clearEditor() {
  for (const c of editorControls) c.destroy?.();
  editorControls = [];
}

function rebuildEditor() {
  clearEditor();
  if (!selectedId) {
    const noneCtrl = editorFolder.add({ none: '(none — pick a part)' }, 'none').disable();
    editorControls.push(noneCtrl);
    return;
  }
  const p = primIndex.get(selectedId);
  if (!p) return;

  // Name + parent
  editorControls.push(editorFolder.add(p, 'name').onChange(() => {
    rebuildPartsFolder();
    rebuild();
  }));

  const parentChoices = ['(root)', ...primitives
    .filter(o => o.id !== p.id && !isAncestor(p.id, o.id))
    .map(o => o.id)];
  const parentProxy = { parent: p.parentId || '(root)' };
  editorControls.push(editorFolder.add(parentProxy, 'parent', parentChoices).onChange((v) => {
    p.parentId = v === '(root)' ? null : v;
    rebuild();
  }));

  // Position
  for (const axis of ['x', 'y', 'z']) {
    editorControls.push(editorFolder
      .add(p.pos, axis, -3, 3, 0.005)
      .name('pos ' + axis)
      .onChange(rebuild));
  }
  // Rotation
  for (const axis of ['x', 'y', 'z']) {
    editorControls.push(editorFolder
      .add(p.rot, axis, -Math.PI, Math.PI, 0.01)
      .name('rot ' + axis)
      .onChange(rebuild));
  }
  // Scale + scale-children toggle. When `scaleChildren` is OFF, scale
  // applies to the mesh only — descendants attached to this primitive
  // stay at their authored size. Useful for resizing the pelvis/root
  // without warping the legs + arms attached to it.
  if (p.scaleChildren == null) p.scaleChildren = true;
  editorControls.push(editorFolder
    .add(p, 'scaleChildren')
    .name('scale children')
    .onChange(() => { rebuild(); attachGizmoToSelected(); }));
  for (const axis of ['x', 'y', 'z']) {
    editorControls.push(editorFolder
      .add(p.scale, axis, 0.05, 5, 0.01)
      .name('scale ' + axis)
      .onChange(rebuild));
  }
  // Color
  editorControls.push(editorFolder
    .addColor(p, 'color')
    .name('color')
    .onChange(rebuild));

  // Opacity — set < 1 to make the primitive transparent so you can
  // see bone helpers, child primitives, or the inside of the part
  // while authoring. Default 1.0 (fully opaque).
  if (p.opacity == null) p.opacity = 1.0;
  editorControls.push(editorFolder
    .add(p, 'opacity', 0.0, 1.0, 0.01)
    .name('opacity')
    .onChange(rebuild));

  // Shape-specific dims
  if (p.type === 'cylinder') {
    editorControls.push(editorFolder.add(p.shape, 'topR', 0.001, 1, 0.005).name('top radius (X)').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'botR', 0.001, 1, 0.005).name('bot radius (X)').onChange(rebuild));
    // Per-end Z depth taper. 1.0 = circular cylinder. Different top
    // vs bot creates an oval/egg cross-section that varies along Y.
    if (p.shape.topDepth == null) p.shape.topDepth = 1.0;
    if (p.shape.botDepth == null) p.shape.botDepth = 1.0;
    editorControls.push(editorFolder.add(p.shape, 'topDepth', 0.05, 3, 0.01).name('top depth (Z)').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'botDepth', 0.05, 3, 0.01).name('bot depth (Z)').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'h',    0.005, 2, 0.005).name('height').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'segs', 4, 64, 1).name('segments').onChange(rebuild));
  } else if (p.type === 'sphere') {
    editorControls.push(editorFolder.add(p.shape, 'r', 0.005, 1, 0.005).name('radius').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'segsW', 4, 64, 1).name('segments W').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'segsH', 4, 64, 1).name('segments H').onChange(rebuild));
  } else if (p.type === 'box') {
    editorControls.push(editorFolder.add(p.shape, 'w', 0.005, 2, 0.005).name('width').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'h', 0.005, 2, 0.005).name('height').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'd', 0.005, 2, 0.005).name('depth').onChange(rebuild));
  } else if (p.type === 'cone') {
    editorControls.push(editorFolder.add(p.shape, 'r', 0.005, 1, 0.005).name('radius').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'h', 0.005, 2, 0.005).name('height').onChange(rebuild));
    editorControls.push(editorFolder.add(p.shape, 'segs', 4, 64, 1).name('segments').onChange(rebuild));
  }

  // Mirror this primitive: clones it with X-flipped position. Useful
  // for symmetric pairs (left/right limb).
  editorControls.push(editorFolder.add({
    mirror: () => mirrorPrim(p.id),
  }, 'mirror').name('mirror across X (clone with -X)'));

  // Delete
  editorControls.push(editorFolder.add({
    del: () => deletePrim(p.id),
  }, 'del').name('delete'));
}

function isAncestor(maybeAncestorId, descendantId) {
  // Returns true if maybeAncestorId is an ancestor of descendantId.
  // Used to prevent setting a primitive's parent to its own descendant.
  let cur = primIndex.get(descendantId);
  while (cur) {
    if (cur.parentId === maybeAncestorId) return true;
    cur = cur.parentId ? primIndex.get(cur.parentId) : null;
  }
  return false;
}

function addPrim(type) {
  pushUndo();
  const p = defaultPrim(type);
  primitives.push(p);
  rebuild();
  rebuildPartsFolder();
  selectPrim(p.id);
}

function selectPrim(id) {
  selectedId = id;
  refreshSelectionVisual();
  attachGizmoToSelected();
  rebuildEditor();
}

function deletePrim(id) {
  pushUndo();
  // Reparent any children to the deleted primitive's parent.
  const target = primIndex.get(id);
  if (!target) return;
  for (const p of primitives) {
    if (p.parentId === id) p.parentId = target.parentId;
  }
  primitives = primitives.filter(p => p.id !== id);
  if (selectedId === id) selectedId = null;
  rebuild();
  rebuildPartsFolder();
  rebuildEditor();
}

function mirrorPrim(id) {
  pushUndo();
  const orig = primIndex.get(id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.id = newId(orig.type);
  copy.name = orig.name + '_mirror';
  copy.pos.x = -orig.pos.x;
  copy.scale.x = -orig.scale.x;
  primitives.push(copy);
  rebuild();
  rebuildPartsFolder();
  selectPrim(copy.id);
}

// ============================================================
// SAVE / LOAD
// ============================================================
const ioFolder = gui.addFolder('save / load');
ioFolder.add({
  save: () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(primitives));
    showToast('Saved to localStorage.');
  },
}, 'save').name('save (localStorage)');
ioFolder.add({
  load: () => {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { showToast('No saved rig found.'); return; }
    try {
      primitives = JSON.parse(raw);
      // Re-seed nextId so new prims get unique ids
      let maxN = 0;
      for (const p of primitives) {
        const m = (p.id || '').match(/_(\w+)$/);
        if (m) {
          const n = parseInt(m[1], 36);
          if (!isNaN(n) && n > maxN) maxN = n;
        }
      }
      nextId = maxN + 1;
      selectedId = null;
      rebuild();
      rebuildPartsFolder();
      rebuildEditor();
      showToast('Loaded from localStorage.');
    } catch (e) {
      showToast('Load failed: ' + e.message);
    }
  },
}, 'load').name('load (localStorage)');
ioFolder.add({
  exportJson: () => {
    const json = JSON.stringify(primitives, null, 2);
    navigator.clipboard.writeText(json).then(
      () => showToast('Copied JSON to clipboard.'),
      () => showToast('Clipboard write failed; see console.'),
    );
    console.log('[rig builder] exported JSON:\n', json);
  },
}, 'exportJson').name('export → clipboard');
ioFolder.add({
  importJson: () => {
    const txt = window.prompt('Paste rig JSON:');
    if (!txt) return;
    try {
      primitives = JSON.parse(txt);
      let maxN = 0;
      for (const p of primitives) {
        const m = (p.id || '').match(/_(\w+)$/);
        if (m) {
          const n = parseInt(m[1], 36);
          if (!isNaN(n) && n > maxN) maxN = n;
        }
      }
      nextId = maxN + 1;
      selectedId = null;
      rebuild();
      rebuildPartsFolder();
      rebuildEditor();
      showToast('Imported.');
    } catch (e) {
      showToast('Parse failed: ' + e.message);
    }
  },
}, 'importJson').name('import from prompt');
// Preset loader — fetches an authored rig JSON from the dev server
// and replaces the current primitives with it. Uses the same restore
// path as load (localStorage) so the editor + parts list refresh
// cleanly. The presets list points at canonical bodies under
// Assets/anatomy/.
const PRESETS = {
  bodyshapes: '../Assets/anatomy/bodyshapes-rig.json',
  female:     '../Assets/anatomy/female-rig.json',
  male:       '../Assets/anatomy/male-rig.json',
};
async function loadPreset(name) {
  const url = PRESETS[name];
  if (!url) { showToast(`Unknown preset: ${name}`); return; }
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    primitives = data;
    let maxN = 0;
    for (const p of primitives) {
      const m = (p.id || '').match(/_(\w+)$/);
      if (m) {
        const n = parseInt(m[1], 36);
        if (!isNaN(n) && n > maxN) maxN = n;
      }
    }
    nextId = maxN + 1;
    selectedId = null;
    rebuild();
    rebuildPartsFolder();
    rebuildEditor();
    showToast(`Loaded preset: ${name}.`);
  } catch (e) {
    showToast(`Preset load failed: ${e.message}`);
    console.error('[rig builder] preset load failed:', e);
  }
}
ioFolder.add({
  bodyshapes: () => loadPreset('bodyshapes'),
}, 'bodyshapes').name('load preset → bodyshapes');
ioFolder.add({
  female: () => loadPreset('female'),
}, 'female').name('load preset → female');
ioFolder.add({
  male: () => loadPreset('male'),
}, 'male').name('load preset → male');
// Expose for headless verification + devtools poking.
window.__loadPreset = loadPreset;

ioFolder.add({
  clear: () => {
    if (!confirm('Clear all primitives?')) return;
    primitives = [];
    selectedId = null;
    nextId = 1;
    rebuild();
    rebuildPartsFolder();
    rebuildEditor();
    showToast('Cleared.');
  },
}, 'clear').name('clear all');

// ============================================================
// CLICK-TO-SELECT
// ============================================================
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (controls.enabled === false) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = Array.from(meshIndex.values());
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length > 0) {
    // Reverse-lookup id from mesh
    const mesh = hits[0].object;
    for (const [id, m] of meshIndex) {
      if (m === mesh) { selectPrim(id); break; }
    }
  }
});

// ============================================================
// TOAST + RENDER LOOP
// ============================================================
const toastEl = document.getElementById('toast');
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function tick() {
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

{
