<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>cold-exit — lowpoly_v2 weapon probe</title>
<style>
  html, body { margin: 0; padding: 0; background: #121316; color: #ddd;
               font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  header { position: sticky; top: 0; z-index: 10;
           background: #1b1d22; border-bottom: 1px solid #2a2d34;
           padding: 10px 16px; display: flex; gap: 10px; align-items: center; }
  header h1 { margin: 0 16px 0 0; font-size: 14px; color: #c9a87a; font-weight: 600; }
  header .count { margin-left: auto; color: #888; }
  .grid { display: grid; gap: 10px; padding: 14px;
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .tile { background: #181a1e; border: 1px solid #2a2d34; border-radius: 4px;
          overflow: hidden; }
  .tile canvas { display: block; width: 100%; height: 180px; background: #0d0e11; }
  .tile .label { padding: 6px 8px; border-top: 1px solid #23262c;
                 font-size: 11px; line-height: 1.3; word-break: break-all; }
  .tile .label b { color: #c9a87a; }
  .tile .dims { padding: 4px 8px; font-size: 10px; color: #777;
                border-top: 1px solid #23262c; }
</style>
</head>
<body>
<header>
  <h1>lowpoly_v2 probe</h1>
  <span style="color: #777;">recolored low_poly_guns_fbx pack — muzzle-axis + scale check</span>
  <span class="count" id="count">loading…</span>
</header>
<div class="grid" id="grid"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const FILES = [
  'flamethrower',
  'fusil_1', 'fusil_2', 'fusil_3', 'fusil_4', 'fusil_5', 'fusil_6', 'fusil_7',
  'pistol_1', 'pistol_2', 'pistol_3', 'pistol_4', 'pistol_5', 'pistol_6',
  'shotgun_1', 'shotgun_2',
  'sniper_0', 'sniper_1', 'sniper_2',
  'subfusil_1', 'subfusil_2', 'subfusil_3', 'subfusil_4', 'subfusil_5',
  'subfusil_6', 'subfusil_7', 'subfusil_8', 'subfusil_9', 'subfusil_10',
];

const grid = document.getElementById('grid');
const count = document.getElementById('count');
const loader = new GLTFLoader();

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(320, 260, false);

let done = 0;
const tiles = FILES.map(name => {
  const t = document.createElement('div');
  t.className = 'tile';
  const c = document.createElement('canvas');
  c.width = 320; c.height = 260;
  t.appendChild(c);
  const lbl = document.createElement('div');
  lbl.className = 'label';
  lbl.innerHTML = `<b>${name}</b>.glb`;
  t.appendChild(lbl);
  const dims = document.createElement('div');
  dims.className = 'dims';
  dims.textContent = 'loading…';
  t.appendChild(dims);
  grid.appendChild(t);
  return { name, canvas: c, dims };
});
count.textContent = `${FILES.length} weapons`;

for (const t of tiles) {
  const url = `/Assets/models/lowpoly_v2/${t.name}.glb`;
  loader.load(url, (gltf) => {
    const root = gltf.scene;
    // Compute bounding box for sizing + axis read.
    const box = new THREE.Box3().setFromObject(root);
    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    t.dims.textContent =
      `dims: x=${size.x.toFixed(2)} y=${size.y.toFixed(2)} z=${size.z.toFixed(2)}  ` +
      `long-axis=${size.x > size.z ? 'X' : 'Z'}`;

    // Center model and frame it.
    root.position.sub(center);
    const scene = new THREE.Scene();
    scene.add(root);
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.9);
    dir.position.set(2, 3, 4);
    scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0xffffff, 0.3);
    dir2.position.set(-2, 1, -3);
    scene.add(dir2);
    // Axes helper to read muzzle orientation.
    const helper = new THREE.AxesHelper(Math.max(size.x, size.y, size.z) * 0.7);
    scene.add(helper);

    const maxDim = Math.max(size.x, size.y, size.z);
    const camera = new THREE.PerspectiveCamera(35, 320 / 260, 0.01, 100);
    const d = maxDim * 1.8;
    camera.position.set(d * 0.7, d * 0.5, d * 0.7);
    camera.lookAt(0, 0, 0);

    renderer.setSize(320, 260, false);
    renderer.render(scene, camera);
    const ctx = t.canvas.getContext('2d');
    ctx.drawImage(renderer.domElement, 0, 0);

    done++;
    count.textContent = `${done} / ${FILES.length} loaded`;
  }, undefined, (err) => {
    t.dims.textContent = 'load error: ' + (err.message || err);
    done++;
    count.textContent = `${done} / ${FILES.length} loaded`;
  });
}
</script>
</body>
</html>
