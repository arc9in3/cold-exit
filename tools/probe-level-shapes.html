<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cold exit · level-shape probe</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; background: #0c0c10; color: #cbd2dc;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  header { padding: 8px 14px; border-bottom: 1px solid #2a2f3a;
    display: flex; gap: 12px; align-items: center; }
  header h1 { margin: 0; font-size: 14px; color: #c9a87a; flex: 1; }
  header button {
    background: #1f2a18; color: #a8d68a; border: 1px solid #3e5a2e;
    padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;
  }
  header button:hover { background: #2a3a20; }
  header label { font-size: 12px; color: #8a9aa8; }
  header input { background: #1a1d24; color: #cbd2dc; border: 1px solid #2a2f3a;
    padding: 3px 6px; font-size: 12px; width: 80px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, 280px);
    gap: 12px; padding: 14px; }
  .card { background: #14171c; border: 1px solid #232830;
    padding: 8px; border-radius: 4px; }
  .card h3 { margin: 0 0 6px 0; font-size: 12px; color: #cbd2dc; }
  .card .meta { font-size: 10px; color: #8a9aa8; margin-bottom: 6px; }
  .card canvas { display: block; background: #0a0a0f;
    border: 1px solid #1a1d24; }
  .legend { padding: 8px 14px; font-size: 11px; color: #8a9aa8;
    border-top: 1px solid #2a2f3a; }
  .legend span { display: inline-block; width: 10px; height: 10px;
    margin: 0 4px 0 12px; vertical-align: middle; }
  .err { color: #d8703a; padding: 14px; }
  #invariant-out { font-family: monospace; font-size: 11px;
    padding: 10px 14px; color: #a8d68a; background: #14171c;
    border-top: 1px solid #2a2f3a; white-space: pre-wrap;
    max-height: 220px; overflow-y: auto; }
  #invariant-out.bad { color: #d8703a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>level-shape probe — Pass 1A</h1>
  <label>seed
    <input type="number" id="seed" value="1">
  </label>
  <label>level idx
    <input type="number" id="lvIdx" value="3" min="1" max="20">
  </label>
  <button id="regen">regenerate</button>
  <button id="probe-all">probe 10 seeds</button>
  <button id="show-outdoor">show outdoor + windows</button>
</header>
<div class="legend">
  <span style="background:#5a6a72"></span>outer wall
  <span style="background:#3a4a52"></span>interior wall
  <span style="background:#8a3a2a"></span>door
  <span style="background:#1a3a4a"></span>walkable
  <span style="background:#3a8a5a"></span>doorway probe
</div>
<div id="grid"></div>
<div id="invariant-out">[invariants will appear here after each generate]</div>

<script type="module">
import * as THREE from 'three';
import { Level } from '../src/level.js';

// Mock the bits Level reaches into. The probe doesn't render in 3D,
// so we just need a stub scene that supports add/remove. We also
// stub createScene's ground reference because Level reaches for
// ground.material.color to apply a theme tint.
function makeStubScene() {
  const stub = {
    children: [],
    add(o)    { this.children.push(o); },
    remove(o) {
      const i = this.children.indexOf(o);
      if (i >= 0) this.children.splice(i, 1);
    },
  };
  return stub;
}

function makeStubGround() {
  return {
    material: { color: { setHex: () => {} } },
  };
}

// Seedable rng — three.js / Math.random are global. We monkey-patch
// Math.random with a mulberry32 PRNG seeded by the input. Hacky but
// preserves determinism without rewriting Level.
function seededRandom(seed) {
  let t = seed >>> 0;
  return function() {
    t |= 0; t = (t + 0x6D2B79F5) | 0;
    let r = Math.imul(t ^ t >>> 15, 1 | t);
    r = (r + Math.imul(r ^ r >>> 7, 61 | r)) ^ r;
    return ((r ^ r >>> 14) >>> 0) / 4294967296;
  };
}

function generateLevel(seed, lvIdx) {
  const origRandom = Math.random;
  Math.random = seededRandom(seed);
  try {
    const scene = makeStubScene();
    const ground = makeStubGround();
    const level = new Level(scene, { ground });
    level.index = lvIdx - 1;  // generate() bumps it by 1
    // Disable any tutorial-mode hooks if a previous test left them.
    if (typeof window !== 'undefined') window.__tutorialMode = () => false;
    level.generate();
    return level;
  } finally {
    Math.random = origRandom;
  }
}

// Pass 1C — when true, drawRoom tints the room background by
// building tag (A=blue, B=green, C=orange), draws windows as bright
// cyan dashes on exterior walls, draws connectors with a dotted
// outline, and draws ledges as pale lines along exterior walls.
let _showOutdoor = false;

function drawRoom(canvas, level, room) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(0, 0, W, H);

  const b = room.bounds;
  const padding = 8;
  // World-to-canvas transform — fit the room AABB into the canvas
  // with some padding so walls slightly outside bounds (chamfer)
  // are still visible.
  const margin = 2;
  const scale = Math.min(
    (W - padding * 2) / (b.maxX - b.minX + margin * 2),
    (H - padding * 2) / (b.maxZ - b.minZ + margin * 2),
  );
  const ox = padding - (b.minX - margin) * scale;
  const oz = padding - (b.minZ - margin) * scale;
  const wx = (x) => ox + x * scale;
  const wz = (z) => oz + z * scale;

  // Walkable bounds (background highlight). Tinted by building tag
  // when outdoor mode is enabled.
  if (room._walkableBounds) {
    if (_showOutdoor && room.building) {
      const tints = { A: '#2a3a5a', B: '#2a4a3a', C: '#4a3a2a', connector: '#5a4a5a' };
      ctx.fillStyle = tints[room.building] || '#1a3a4a';
    } else {
      ctx.fillStyle = '#1a3a4a';
    }
    ctx.globalAlpha = 0.35;
    for (const wb of room._walkableBounds) {
      ctx.fillRect(wx(wb.minX), wz(wb.minZ),
        (wb.maxX - wb.minX) * scale, (wb.maxZ - wb.minZ) * scale);
    }
    ctx.globalAlpha = 1.0;
  }
  // Connector room — dotted outline.
  if (_showOutdoor && room.type === 'connector') {
    ctx.strokeStyle = '#c39066';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([3, 2]);
    ctx.strokeRect(wx(b.minX), wz(b.minZ),
      (b.maxX - b.minX) * scale, (b.maxZ - b.minZ) * scale);
    ctx.setLineDash([]);
  }

  // Walls + doors — draw every obstacle whose AABB intersects the
  // room bounds. Color by userData kind so the schematic communicates.
  for (const obs of level.obstacles) {
    const cb = obs.userData && obs.userData.collisionXZ;
    if (!cb) continue;
    if (cb.maxX < b.minX - margin || cb.minX > b.maxX + margin) continue;
    if (cb.maxZ < b.minZ - margin || cb.minZ > b.maxZ + margin) continue;
    const isDoor = obs.userData.isDoor;
    const isLowCover = obs.userData.isLowCover;
    const isPlatform = obs.userData.isPlatform;
    const isRailing = obs.userData.isRailing;
    let color = '#5a6a72';                    // outer wall
    if (isDoor) color = '#8a3a2a';
    else if (isPlatform) color = '#3a4a3a';
    else if (isRailing) color = '#5a8a8a';
    else if (isLowCover) color = '#4a4a3a';
    ctx.fillStyle = color;
    ctx.fillRect(wx(cb.minX), wz(cb.minZ),
      Math.max(1, (cb.maxX - cb.minX) * scale),
      Math.max(1, (cb.maxZ - cb.minZ) * scale));
  }
  // Cell-bound outline
  ctx.strokeStyle = '#2a3a4a';
  ctx.lineWidth = 1;
  ctx.strokeRect(wx(b.minX), wz(b.minZ),
    (b.maxX - b.minX) * scale, (b.maxZ - b.minZ) * scale);

  // Pass 1C overlays — windows + ledges within this room.
  if (_showOutdoor) {
    // Windows on exterior walls — bright cyan dashes.
    if (level._windows) {
      ctx.strokeStyle = '#5fd8e8';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 2]);
      for (const w of level._windows) {
        if (w.room !== room) continue;
        const isHoriz = (w.side === 'north' || w.side === 'south');
        ctx.beginPath();
        if (isHoriz) {
          ctx.moveTo(wx(w.x - 2), wz(w.z));
          ctx.lineTo(wx(w.x + 2), wz(w.z));
        } else {
          ctx.moveTo(wx(w.x), wz(w.z - 2));
          ctx.lineTo(wx(w.x), wz(w.z + 2));
        }
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    // Ledges — pale lines along the inside of exterior walls.
    if (level.ledges) {
      ctx.strokeStyle = '#a8b8c0';
      ctx.lineWidth = 1.2;
      for (const lg of level.ledges) {
        if (lg.room !== room) continue;
        ctx.beginPath();
        ctx.moveTo(wx(lg.x1), wz(lg.z1));
        ctx.lineTo(wx(lg.x2), wz(lg.z2));
        ctx.stroke();
      }
    }
  }

  // Doorway probe markers
  if (room.neighbors) {
    ctx.fillStyle = '#3a8a5a';
    for (const n of room.neighbors) {
      const other = level.rooms[n.otherId];
      if (!other) continue;
      let dx, dz;
      if (n.dir === 'north')      { dx = other.cx; dz = b.minZ + 1; }
      else if (n.dir === 'south') { dx = other.cx; dz = b.maxZ - 1; }
      else if (n.dir === 'east')  { dx = b.maxX - 1; dz = other.cz; }
      else                         { dx = b.minX + 1; dz = other.cz; }
      ctx.beginPath();
      ctx.arc(wx(dx), wz(dz), 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function render(level) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (!level || !level.rooms) {
    grid.innerHTML = '<div class="err">level generation failed — see console</div>';
    return;
  }
  // Group rooms by shape so the same shape is visible across many
  // rooms in one screen.
  const byShape = new Map();
  for (const r of level.rooms) {
    const s = r.shape || 'rect';
    if (!byShape.has(s)) byShape.set(s, []);
    byShape.get(s).push(r);
  }

  for (const [shape, rooms] of byShape) {
    for (const r of rooms) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h3>${shape} <span style="color:#8a9aa8">· room ${r.id}</span></h3>
        <div class="meta">type: ${r.type} · layout: ${r.layout || '—'} · cell (${r.cellX}, ${r.cellZ}) · neighbors: ${(r.neighbors || []).map(n => n.dir).join(',') || 'none'}</div>
      `;
      const c = document.createElement('canvas');
      c.width = 260; c.height = 200;
      card.appendChild(c);
      grid.appendChild(card);
      drawRoom(c, level, r);
    }
  }
  // Run + display invariants. checkPathwayInvariants() runs the
  // door-only flood-fill; runOutdoorInvariants() layers Pass 1C
  // checks (connector back-links, ledge inside-drops, building
  // convexity) on top.
  if (typeof level.checkPathwayInvariants === 'function') {
    const result = level.checkPathwayInvariants();
    const outdoor = (typeof level.runOutdoorInvariants === 'function')
      ? level.runOutdoorInvariants() : null;
    const el = document.getElementById('invariant-out');
    const overallOk = result.ok && (!outdoor || outdoor.ok);
    el.classList.toggle('bad', !overallOk);
    const lines = [`pathway: ${result.ok ? 'OK' : 'FAIL'}`,
                   `outdoor: ${outdoor ? (outdoor.ok ? 'OK' : 'FAIL') : 'n/a'}`];
    if (result.failures && result.failures.length) {
      for (const f of result.failures) {
        lines.push(`  · path: ${JSON.stringify(f)}`);
      }
    }
    if (outdoor && outdoor.failures && outdoor.failures.length) {
      for (const f of outdoor.failures) {
        lines.push(`  · outdoor: ${JSON.stringify(f)}`);
      }
    }
    lines.push(`shape distribution: ${[...byShape.keys()].map(k => `${k}=${byShape.get(k).length}`).join(' ')}`);
    if (level._connectors && level._connectors.length) {
      lines.push(`connectors: ${level._connectors.map(c => `${c.connectorKind}@${c.id}`).join(' ')}`);
    }
    if (level._windows && level._windows.length) {
      lines.push(`windows: ${level._windows.length} · ledges: ${(level.ledges || []).length}`);
    }
    el.textContent = lines.join('\n');
  }
}

function regen() {
  const seed = parseInt(document.getElementById('seed').value, 10) || 1;
  const lvIdx = parseInt(document.getElementById('lvIdx').value, 10) || 1;
  try {
    const level = generateLevel(seed, lvIdx);
    render(level);
  } catch (err) {
    console.error('generate failed:', err);
    const grid = document.getElementById('grid');
    grid.innerHTML = `<div class="err">error: ${err && err.message}</div>`;
  }
}

document.getElementById('regen').addEventListener('click', regen);
document.getElementById('show-outdoor').addEventListener('click', () => {
  _showOutdoor = !_showOutdoor;
  const btn = document.getElementById('show-outdoor');
  btn.textContent = _showOutdoor ? 'hide outdoor + windows' : 'show outdoor + windows';
  regen();
});
document.getElementById('probe-all').addEventListener('click', () => {
  const lvIdx = parseInt(document.getElementById('lvIdx').value, 10) || 1;
  const out = [];
  for (let s = 1; s <= 10; s++) {
    try {
      const level = generateLevel(s, lvIdx);
      const shapes = level.rooms.map(r => r.shape || 'rect');
      const inv = level.checkPathwayInvariants ? level.checkPathwayInvariants() : null;
      out.push(`seed ${s}: ${shapes.length} rooms · shapes: ${shapes.join(',')} · invariants: ${inv ? (inv.ok ? 'OK' : 'FAIL ' + JSON.stringify(inv.failures)) : 'n/a'}`);
    } catch (err) {
      out.push(`seed ${s}: ERROR ${err.message}`);
    }
  }
  document.getElementById('invariant-out').textContent = out.join('\n');
});

regen();
</script>
</body>
</html>
